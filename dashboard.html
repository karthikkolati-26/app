<!DOCTYPE html>
<html>
<head>
<title>Resume Analyzer</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f4f6fb;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:220px;
height:100vh;
background:#667eea;
color:white;
padding-top:30px;
position:fixed;
}

.sidebar h2{text-align:center;margin-bottom:30px}

.sidebar button{
display:block;
width:80%;
margin:12px auto;
padding:12px;
border:none;
border-radius:8px;
background:white;
color:#667eea;
font-weight:bold;
cursor:pointer;
}

/* MAIN */
.main{
margin-left:220px;
width:100%;
padding:40px;
}

.card{
background:white;
padding:30px;
border-radius:18px;
width:520px;
margin:auto;
box-shadow:0 20px 50px rgba(0,0,0,0.1);
text-align:center;
}

.primary{
background:#667eea;
color:white;
border:none;
padding:12px;
border-radius:10px;
width:100%;
margin-top:15px;
cursor:pointer;
}

/* JOB CARD */
.job{
border:1px solid #eee;
padding:20px;
margin-top:20px;
border-radius:12px;
text-align:left;
}

.best{
border:2px solid #4CAF50;
background:#e8f5e9;
}

.skill{
display:inline-block;
margin:5px;
padding:6px 10px;
border-radius:8px;
font-size:13px;
}

.match{background:#d4edda;color:#155724}
.miss{background:#f8d7da;color:#721c24}

.loader{font-weight:bold;color:#667eea}
.error{color:red;font-weight:bold}

/* PROGRESS BAR */
.bar{
height:10px;
border-radius:10px;
background:#ddd;
margin-top:8px;
}

.fill{
height:10px;
border-radius:10px;
background:#4CAF50;
}

/* FEEDBACK MODAL */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:25px;
border-radius:15px;
width:300px;
text-align:center;
}

.star{
font-size:25px;
cursor:pointer;
color:#ccc;
}

.star.active{color:gold}


/* MOBILE RESPONSIVE */
@media(max-width:768px){

body{flex-direction:column}

.sidebar{
width:100%;
height:auto;
position:relative;
display:flex;
justify-content:space-around;
align-items:center;
padding:10px 0;
}

.sidebar h2{display:none}

.sidebar button{
width:auto;
margin:5px;
padding:10px 14px;
font-size:14px;
}

.main{
margin-left:0;
padding:15px;
}

.card{
width:100%;
padding:20px;
}

.job{
font-size:14px;
}

}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Analyzer</h2>
<button onclick="location.href='history.html'">History</button>
<button onclick="openFeedback()">Feedback</button>
<button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">
<div class="card">

<h3>Upload Resume PDF</h3>
<input type="file" id="file" accept=".pdf"><br>
<button class="primary" onclick="analyze()">Analyze Resume</button>

<div id="result"></div>

</div>
</div>

<!-- FEEDBACK MODAL -->
<div id="feedbackModal" class="modal">
<div class="box">

<h3>Rate & Feedback</h3>

<div id="stars">
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<br>

<textarea id="feedbackText" placeholder="Write feedback..."
style="width:100%;height:80px"></textarea>

<br><br>

<button onclick="submitFeedback()">Submit</button>
<button onclick="closeFeedback()">Cancel</button>

<p id="msg"></p>

</div>
</div>

<!-- LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
  authDomain: "job-app-683fa.firebaseapp.com",
  projectId: "job-app-683fa",
  storageBucket: "job-app-683fa.firebasestorage.app",
  messagingSenderId: "951123608239",
  appId: "1:951123608239:web:1e75570a094bc98b2b4a5a"
};
firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(u=>{
if(!u) location.href="login.html";
});

function logout(){
auth.signOut().then(()=>location.href="login.html");
}


/* NORMALIZE */
function normalize(s){
return s.toLowerCase().replace(/[^a-z ]/g,"").trim();
}


/* PDF TEXT */
async function extractText(file){

if(!file || file.type!=="application/pdf")
throw "invalid";

const reader=new FileReader();

return new Promise(resolve=>{
reader.onload=async function(){

const pdf=await pdfjsLib.getDocument(
new Uint8Array(this.result)).promise;

let text="";
for(let i=1;i<=pdf.numPages;i++){
let page=await pdf.getPage(i);
let content=await page.getTextContent();
text+=content.items.map(it=>it.str).join(" ");
}

resolve(text.toLowerCase());
};
reader.readAsArrayBuffer(file);
});
}


/* REALISTIC ATS SCORE */
function calcATS(text, matched, total){

let score=0;

// ---------- Sections ----------
["education","experience","skills","projects","summary"]
.forEach(sec=>{
 if(text.includes(sec)) score+=6;
});

// ---------- Length ----------
let words=text.split(/\s+/).length;

if(words>500 && words<900) score+=20;
else if(words>300) score+=15;
else if(words>150) score+=10;
else if(words<120) score-=15;

// ---------- Skill Match ----------
let percent=(matched.length/total)*100;
score+=percent*0.25;

// ---------- Contact Info ----------
if(/\S+@\S+\.\S+/.test(text)) score+=10;
if(/(\+?\d{1,3}[- ]?)?\d{10}/.test(text)) score+=10;

// ---------- Skill Count ----------
if(matched.length>=6) score+=15;
else if(matched.length>=3) score+=8;

// ---------- Formatting ----------
if(text.includes("•") || text.includes("- ")) score+=5;

// ---------- Clamp ----------
return Math.max(0,Math.min(Math.round(score),100));
}


/* COURSES */
const courses={
html:"https://youtu.be/qz0aGYrrlhU",
css:"https://youtu.be/1Rs2ND1ryYc",
javascript:"https://youtu.be/PkZNo7MFNFg",
react:"https://youtu.be/bMknfKXIFA8",
node:"https://youtu.be/TlB_eWDSMt4",
python:"https://youtu.be/_uQrJ0TkZlc"
};


/* ROADMAP */
function roadmap(missing){

if(!missing.length)
return "<p style='color:green'>Perfect Match 🎉</p>";

let html="";

missing.forEach(skill=>{
let link=courses[skill]||
`https://youtube.com/results?search_query=${skill}+course`;

html+=`<div><a target="_blank" href="${link}">📘 Learn ${skill}</a></div>`;
});

return html;
}


/* ANALYZE */
async function analyze(){

const file=document.getElementById("file").files[0];
const out=document.getElementById("result");

out.innerHTML="<div class='loader'>Analyzing...</div>";

try{

const text=await extractText(file);
const snap=await db.collection("jobs").get();

let results=[];

snap.forEach(doc=>{

let job=doc.data();
let skills=(job.skills||[]).map(normalize);

let matched=skills.filter(s=>text.includes(s));
let missing=skills.filter(s=>!matched.includes(s));

let matchScore=Math.round((matched.length/skills.length)*100)||0;

if(matchScore<40) return;

let ats=calcATS(text,matched,skills.length);

results.push({title:job.title,matched,missing,matchScore,ats});
});

if(!results.length){
out.innerHTML="<p class='error'>No jobs match above 40%</p>";
return;
}

results.sort((a,b)=>b.matchScore-a.matchScore);
let best=results[0];

let html="";

results.forEach(job=>{
html+=`
<div class="job ${job===best?"best":""}">

<h2>${job.title}</h2>

<b>Match Score: ${job.matchScore}%</b>
<div class="bar"><div class="fill" style="width:${job.matchScore}%"></div></div>

<b>ATS Score: ${job.ats}%</b>
<div class="bar"><div class="fill" style="width:${job.ats}%"></div></div>

<br>

<b>Matched</b><br>
${job.matched.map(s=>`<span class="skill match">${s}</span>`).join("")||"None"}

<br><br>

<b>Missing</b><br>
${job.missing.map(s=>`<span class="skill miss">${s}</span>`).join("")||"None"}

<h4>Improve Skills</h4>
${roadmap(job.missing)}

</div>`;
});

out.innerHTML=html;

}catch{
out.innerHTML="<p class='error'>Upload valid PDF resume</p>";
}
}


/* FEEDBACK */

let rating=0;

function openFeedback(){
document.getElementById("feedbackModal").style.display="flex";
}

function closeFeedback(){
document.getElementById("feedbackModal").style.display="none";
}

function rate(n){
rating=n;
document.querySelectorAll(".star").forEach((s,i)=>{
s.classList.toggle("active",i<n);
});
}

async function submitFeedback(){

let text=document.getElementById("feedbackText").value;
let msg=document.getElementById("msg");

if(!rating){
msg.innerText="Select rating";
return;
}

await db.collection("feedback").add({
rating:rating,
message:text,
email:auth.currentUser.email,
date:new Date().toLocaleString()
});

msg.innerText="Thanks for feedback!";

document.getElementById("feedbackText").value="";
rating=0;
document.querySelectorAll(".star").forEach(s=>s.classList.remove("active"));

setTimeout(closeFeedback,1200);
}

</script>
</body>
</html>

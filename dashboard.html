<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Analyzer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* --- BASE STYLES --- */
body {
  margin: 0;
  font-family: 'Inter', sans-serif; /* Updated Font */
  background: #f4f6fb;
  display: flex;
}

/* --- SIDEBAR --- */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #667eea;
  color: white;
  padding-top: 30px;
  position: fixed;
}
.sidebar h2 {
  text-align: center;
  margin-bottom: 30px;
}
.sidebar button {
  display: block;
  width: 80%;
  margin: 12px auto;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: white;
  color: #667eea;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}
.sidebar button:hover {
  background: #eef2ff;
}

/* --- MAIN CONTENT & CARD --- */
.main {
  margin-left: 220px;
  width: 100%;
  padding: 40px;
  box-sizing: border-box;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  max-width: 550px;
  margin: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.05);
  text-align: center;
}

/* --- UPLOAD AREA STYLES --- */
.upload-area {
  border: 2px dashed #667eea;
  background: #f8faff;
  padding: 30px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 10px;
  transition: 0.3s;
}
.upload-area:hover {
  background: #eef2ff;
}
#fileNameDisplay {
  color: #667eea;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 15px;
}

/* --- BUTTONS & ELEMENTS --- */
.primary {
  background: #667eea;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 10px;
  width: 100%;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
.primary:hover {
  background: #5a6fe0;
}
.job {
  border: 1px solid #eee;
  padding: 20px;
  margin-top: 25px;
  border-radius: 12px;
  text-align: left;
}
.best {
  border: 2px solid #4CAF50;
  background: #e8f5e9;
}
.skill {
  display: inline-block;
  margin: 5px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.match { background: #d4edda; color: #155724; }
.miss { background: #f8d7da; color: #721c24; }
.loader { font-weight: bold; color: #667eea; margin-top: 20px; }
.error { color: red; font-weight: bold; margin-top: 20px; }
.bar { height: 10px; border-radius: 10px; background: #ddd; margin-top: 8px; margin-bottom: 15px; }
.fill { height: 10px; border-radius: 10px; background: #4CAF50; transition: width 1s ease-in-out; }

/* --- MODAL --- */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 300px;
  text-align: center;
}
.star { font-size: 30px; cursor: pointer; color: #ccc; }
.star.active { color: gold; }

/* --- MOBILE RESPONSIVENESS (BOTTOM NAV) --- */
@media(max-width: 768px) {
  body { 
    flex-direction: column; 
    padding-bottom: 80px; /* Space for bottom nav */
  }
  
  .sidebar {
    width: 100%;
    height: 70px;
    position: fixed;
    bottom: 0;
    left: 0;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 0;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    z-index: 1000;
  }
  
  .sidebar h2 { display: none; }
  
  .sidebar button {
    width: auto;
    margin: 0;
    padding: 8px 15px;
    font-size: 14px;
    background: transparent;
    color: white;
  }
  .sidebar button:hover {
    background: rgba(255,255,255,0.2);
  }
  
  .main { margin-left: 0; padding: 15px; }
  .card { width: 100%; padding: 20px; box-sizing: border-box; }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Analyzer</h2>
  <button onclick="location.href='history.html'">History</button>
  <button onclick="openFeedback()">Feedback</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">
  <div class="card">
    <h3>Upload Resume PDF</h3>
    
    <div class="upload-area" onclick="document.getElementById('file').click()">
      <span style="font-size: 35px;">📄</span>
      <p style="color: #667eea; font-weight: 600; margin-top: 10px;">Click to Upload Resume</p>
      <input type="file" id="file" accept=".pdf" style="display: none;" onchange="updateFileName()">
    </div>
    <p id="fileNameDisplay"></p> <button class="primary" onclick="analyze()">Analyze Resume</button>

    <div id="result"></div>
  </div>
</div>

<div id="feedbackModal" class="modal">
  <div class="box">
    <h3>Rate & Feedback</h3>
    <span class="star" onclick="rate(1)">★</span>
    <span class="star" onclick="rate(2)">★</span>
    <span class="star" onclick="rate(3)">★</span>
    <span class="star" onclick="rate(4)">★</span>
    <span class="star" onclick="rate(5)">★</span>
    <br><br>
    <textarea id="feedbackText" style="width:100%;height:80px;border-radius:8px;padding:8px;border:1px solid #ccc;"></textarea>
    <br><br>
    <button class="primary" style="margin-bottom:10px;" onclick="submitFeedback()">Submit</button>
    <button onclick="closeFeedback()" style="border:none;background:none;color:#888;cursor:pointer;">Cancel</button>
    <p id="msg"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* FIREBASE INIT (Keep your own keys here) */
const firebaseConfig = {
  apiKey: "AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
  authDomain: "job-app-683fa.firebaseapp.com",
  projectId: "job-app-683fa",
  storageBucket: "job-app-683fa.firebasestorage.app",
  messagingSenderId: "951123608239",
  appId: "1:951123608239:web:1e75570a094bc98b2b4a5a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(u => {
  if(!u) location.href = "login.html";
});

function logout() {
  auth.signOut().then(() => location.href = "login.html");
}

/* UI HELPERS */
function updateFileName() {
  const file = document.getElementById("file").files[0];
  if(file) {
    document.getElementById("fileNameDisplay").innerText = "Selected File: " + file.name;
  }
}

function normalize(s) {
  return (s || "").toLowerCase().replace(/[^a-z ]/g, "").trim();
}

function isResume(text) {
  const keywords = ["education", "experience", "skills", "project", "summary"];
  const matchCount = keywords.filter(k => text.includes(k)).length;
  return matchCount >= 2; // Requires at least 2 sections to prevent fake resumes
}

/* PDF EXTRACT */
async function extractText(file) {
  if(!file || file.type !== "application/pdf") throw "invalid";
  const reader = new FileReader();
  return new Promise(resolve => {
    reader.onload = async function() {
      const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
      let text = "";
      for(let i=1; i<=pdf.numPages; i++) {
        let page = await pdf.getPage(i);
        let content = await page.getTextContent();
        text += content.items.map(it => it.str).join(" ");
      }
      resolve(text.toLowerCase());
    };
    reader.readAsArrayBuffer(file);
  });
}

/* REALISTIC ATS SCORING */
function calcATS(text, matched, total){

  let score = 0;
  let words = text.split(/\s+/).length;

  /* MATCH SCORE (MAX 40) */
  let matchScore = total>0 ? (matched.length/total)*40 : 0;
  score += matchScore;

  /* SECTION CHECK (MAX 20) */
  const sections=["education","experience","skills","projects","summary"];
  let found = sections.filter(s=>new RegExp(`\\b${s}\\b`,'i').test(text)).length;
  score += (found/sections.length)*20;

  /* LENGTH (MAX 10) */
  if(words>=400 && words<=900) score+=10;
  else if(words>=250) score+=7;
  else if(words>=150) score+=4;
  else score-=5;   // penalty

  /* CONTACT INFO (MAX 10) */
  if(/\S+@\S+\.\S+/.test(text)) score+=5;
  else score-=5;

  if(/(\+?\d{1,3}[- ]?)?\d{10}/.test(text)) score+=5;
  else score-=3;

  /* ACHIEVEMENTS (MAX 10) */
  if(/\d+%|\d+x|\$\d+|\d+\+/.test(text)) score+=10;
  else score-=5;

  /* EXPERIENCE SIGNAL (MAX 10) */
  if(/\bexperience\b|\bintern\b|\bdeveloper\b|\bengineer\b/i.test(text))
    score+=10;
  else score-=6;

  /* CLAMP FINAL */
  return Math.max(25, Math.min(Math.round(score), 92));
}



/* COURSES ROADMAP */
const courses = {
  html: "https://youtu.be/qz0aGYrrlhU",
  css: "https://youtu.be/1Rs2ND1ryYc",
  javascript: "https://youtu.be/PkZNo7MFNFg",
  react: "https://youtu.be/bMknfKXIFA8",
  node: "https://youtu.be/TlB_eWDSMt4",
  python: "https://youtu.be/_uQrJ0TkZlc"
};

function roadmap(missing) {
  if(!missing.length) return "<p style='color:green; font-weight:bold;'>Perfect Match 🎉</p>";
  let html = "";
  missing.forEach(skill => {
    let link = courses[skill] || `https://youtube.com/results?search_query=${skill}+course`;
    html += `<div style="margin-bottom:8px;"><a target="_blank" href="${link}" style="text-decoration:none; color:#1E88E5; font-weight:600;">📘 Learn ${skill}</a></div>`;
  });
  return html;
}

/* ANALYZE LOGIC */
async function analyze() {
  const fileInput = document.getElementById("file");
  if (!fileInput.files.length) {
    document.getElementById("result").innerHTML = "<p class='error'>Please select a PDF file first.</p>";
    return;
  }
  const file = fileInput.files[0];
  const out = document.getElementById("result");

  out.innerHTML = "<div class='loader'>⚙️ Analyzing your resume...</div>";

  try {
    const text = await extractText(file);

    if(!isResume(text)) {
      out.innerHTML = "<p class='error'>This file doesn't look like a standard resume.</p>";
      return;
    }

    const snap = await db.collection("jobs").get();
    let results = [];

    snap.forEach(doc => {
      let job = doc.data();
      let skills = (job.skills || []).map(normalize).filter(Boolean);
      if(!skills.length) return;

      // FIXED: Using Regex so "C" doesn't match "Education"
      let matched = skills.filter(s => new RegExp(`\\b${s}\\b`, 'i').test(text));
      let missing = skills.filter(s => !matched.includes(s));

      let matchScore = Math.round((matched.length / skills.length) * 100);
      if(matchScore < 40) return;

      let ats = calcATS(text, matched, skills.length);
      

      results.push({title: job.title, matched, missing, matchScore, ats});
    });

    if(!results.length) {
      out.innerHTML = "<p class='error'>No jobs match above 40%. Try adding more skills!</p>";
      return;
    }

    results.sort((a, b) => b.matchScore - a.matchScore);
    let best = results[0];
    let html = "";

    results.forEach(job => {
      let status = job.ats > 80 ? "<span style='color:green;font-weight:bold;'>Recruiter-Ready 🔥</span>" 
                 : job.ats > 65 ? "<span style='color:#1E88E5;font-weight:bold;'>Strong 💪</span>" 
                 : job.ats > 50 ? "<span style='color:orange;font-weight:bold;'>Needs Improvement ⚠️</span>" 
                 : "<span style='color:red;font-weight:bold;'>Weak ❌</span>";

      html += `
      <div class="job ${job === best ? "best" : ""}">
        <h2 style="margin-top:0;">${job.title}</h2>

        <b>Match Score: ${job.matchScore}%</b>
        <div class="bar"><div class="fill" style="width:${job.matchScore}%"></div></div>

        <b>ATS Score: ${job.ats}%</b>
        <div class="bar"><div class="fill" style="width:${job.ats}%"></div></div>

        <b>Status:</b> ${status}
        <br><br>

        <b>✅ Matched Skills</b><br>
        ${job.matched.map(s => `<span class="skill match">${s}</span>`).join("")}
        <br><br>

        <b>❌ Missing Skills</b><br>
        ${job.missing.map(s => `<span class="skill miss">${s}</span>`).join("")}

        <h4 style="margin-bottom:10px;">Improve Skills</h4>
        ${roadmap(job.missing)}

        
      </div>`;
    });

    out.innerHTML = html;

  } catch(e) {
    console.error(e);
    out.innerHTML = "<p class='error'>Failed to read PDF. Make sure it's a valid resume.</p>";
  }
}

/* FEEDBACK LOGIC */
let rating = 0;

function openFeedback() { document.getElementById("feedbackModal").style.display = "flex"; }
function closeFeedback() { document.getElementById("feedbackModal").style.display = "none"; }

function rate(n) {
  rating = n;
  document.querySelectorAll(".star").forEach((s, i) => s.classList.toggle("active", i < n));
}

async function submitFeedback() {
  let text = document.getElementById("feedbackText").value.trim();
  let msg = document.getElementById("msg");

  if(!rating) { msg.innerHTML = "<span style='color:red'>Select a star rating.</span>"; return; }
  if(!text) { msg.innerHTML = "<span style='color:red'>Write some feedback.</span>"; return; }

  let email = auth.currentUser ? auth.currentUser.email : "Anonymous";

  await db.collection("feedback").add({
    rating, message: text, email, date: new Date().toLocaleString()
  });

  msg.innerHTML = "<span style='color:green'>Thanks for your feedback!</span>";
  setTimeout(() => {
    closeFeedback();
    document.getElementById("feedbackText").value = "";
    rate(0);
    msg.innerHTML = "";
  }, 1200);
}
</script>
</body>
</html>

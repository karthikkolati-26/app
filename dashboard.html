<!DOCTYPE html>
<html>
<head>
<title>Resume Analyzer</title>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6fb;display:flex}
.sidebar{width:220px;height:100vh;background:#667eea;color:white;padding-top:30px;position:fixed}
.sidebar h2{text-align:center;margin-bottom:30px}
.sidebar button{display:block;width:80%;margin:12px auto;padding:12px;border:none;border-radius:8px;background:white;color:#667eea;font-weight:bold;cursor:pointer}
.main{margin-left:220px;width:100%;padding:40px}
.card{background:white;padding:30px;border-radius:18px;width:520px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,0.1);text-align:center}
.primary{background:#667eea;color:white;border:none;padding:12px;border-radius:10px;width:100%;margin-top:15px;cursor:pointer}
.job{border:1px solid #eee;padding:20px;margin-top:20px;border-radius:12px;text-align:left}
.best{border:2px solid #4CAF50;background:#e8f5e9}
.skill{display:inline-block;margin:5px;padding:6px 10px;border-radius:8px;font-size:13px}
.match{background:#d4edda;color:#155724}
.miss{background:#f8d7da;color:#721c24}
.loader{font-weight:bold;color:#667eea}
.error{color:red;font-weight:bold}
.bar{height:10px;border-radius:10px;background:#ddd;margin-top:8px}
.fill{height:10px;border-radius:10px;background:#4CAF50}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center}
.box{background:white;padding:25px;border-radius:15px;width:300px;text-align:center}
.star{font-size:25px;cursor:pointer;color:#ccc}
.star.active{color:gold}
@media(max-width:768px){
body{flex-direction:column}
.sidebar{width:100%;height:auto;position:relative;display:flex;justify-content:space-around;padding:10px}
.sidebar h2{display:none}
.main{margin-left:0;padding:15px}
.card{width:100%}
}
</style>
</head>

<body>

<div class="sidebar">
<h2>Analyzer</h2>
<button onclick="location.href='history.html'">History</button>
<button onclick="openFeedback()">Feedback</button>
<button onclick="logout()">Logout</button>
</div>

<div class="main">
<div class="card">

<h3>Upload Resume PDF</h3>
<input type="file" id="file" accept=".pdf"><br>
<button class="primary" onclick="analyze()">Analyze Resume</button>

<div id="result"></div>

</div>
</div>

<div id="feedbackModal" class="modal">
<div class="box">
<h3>Rate & Feedback</h3>

<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>

<br><br>

<textarea id="feedbackText" style="width:100%;height:80px"></textarea>

<br><br>
<button onclick="submitFeedback()">Submit</button>
<button onclick="closeFeedback()">Cancel</button>

<p id="msg"></p>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
  authDomain: "job-app-683fa.firebaseapp.com",
  projectId: "job-app-683fa",
  storageBucket: "job-app-683fa.firebasestorage.app",
  messagingSenderId: "951123608239",
  appId: "1:951123608239:web:1e75570a094bc98b2b4a5a"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(u=>{
if(!u) location.href="login.html";
});

function logout(){
auth.signOut().then(()=>location.href="login.html");
}

/* HELPERS */
function normalize(s){
return (s||"").toLowerCase().replace(/[^a-z ]/g,"").trim();
}

function isResume(text){
return ["education","experience","skills","project","summary"]
.some(k=>text.includes(k));
}

/* PDF EXTRACT */
async function extractText(file){
if(!file||file.type!=="application/pdf") throw "invalid";
const reader=new FileReader();
return new Promise(resolve=>{
reader.onload=async function(){
const pdf=await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
let text="";
for(let i=1;i<=pdf.numPages;i++){
let page=await pdf.getPage(i);
let content=await page.getTextContent();
text+=content.items.map(it=>it.str).join(" ");
}
resolve(text.toLowerCase());
};
reader.readAsArrayBuffer(file);
});
}

/* REALISTIC ATS */
function calcATS(text, matched, total){

text = text.toLowerCase();
let score = 0;

/* ------------------------------
1️⃣ Section Presence (25 pts)
------------------------------ */
const sections = {
education:5,
experience:8,
skills:4,
projects:5,
summary:3
};

Object.keys(sections).forEach(sec=>{
if(text.includes(sec)) score += sections[sec];
});


/* ------------------------------
2️⃣ Resume Length (15 pts)
Recruiters prefer 400–800 words
------------------------------ */
let words = text.split(/\s+/).length;

if(words>=400 && words<=800) score+=15;
else if(words>=250) score+=10;
else if(words>=150) score+=6;
else if(words<120) score-=10;


/* ------------------------------
3️⃣ Skill Match Quality (20 pts)
------------------------------ */
if(total>0){
let ratio = matched.length/total;

if(ratio>=0.8) score+=20;
else if(ratio>=0.6) score+=15;
else if(ratio>=0.4) score+=10;
else if(ratio>=0.2) score+=5;
}


/* ------------------------------
4️⃣ Contact Info (5 pts)
------------------------------ */
if(/\S+@\S+\.\S+/.test(text)) score+=3;
if(/(\+?\d{1,3}[- ]?)?\d{10}/.test(text)) score+=2;


/* ------------------------------
5️⃣ Action Verbs (15 pts)
Recruiters love impact verbs
------------------------------ */
const verbs=[
"developed","built","designed","implemented",
"optimized","created","led","improved",
"achieved","delivered","increased","reduced"
];

let verbCount = verbs.filter(v=>text.includes(v)).length;

if(verbCount>=6) score+=15;
else if(verbCount>=4) score+=10;
else if(verbCount>=2) score+=6;
else if(verbCount>=1) score+=3;


/* ------------------------------
6️⃣ Quantified Achievements (10 pts)
------------------------------ */
if(/\d+%|\d+x|\$\d+|\d+\+/.test(text)) score+=10;


/* ------------------------------
7️⃣ Formatting Quality (10 pts)
------------------------------ */
if(text.includes("•") || text.includes("- ")) score+=5;
if(text.includes("\n")) score+=5;


/* ------------------------------
FINAL LIMIT
------------------------------ */
return Math.max(0, Math.min(Math.round(score), 100));
}

/* PREMIUM INSIGHTS */
function premiumInsights(text,matched,total){

let words=text.split(/\s+/).length;
let ratio=(matched.length/total)*100;

let strength=Math.round(
(ratio*0.5)+
(Math.min(words,700)/700*30)+
(matched.length*3)
);

let readTime=Math.min(12,Math.max(4,Math.round(words/200)));

let interviewChance=Math.round(
(ratio*0.6)+
(words>300?15:5)+
(text.includes("project")?10:0)
);

let salary;

if(ratio>85 && words>400) salary="₹10-15 LPA";
else if(ratio>70) salary="₹6-10 LPA";
else if(ratio>55) salary="₹4-7 LPA";
else if(ratio>40) salary="₹3-5 LPA";
else salary="₹2-4 LPA";

return{
strength:Math.min(strength,100),
readTime,
interviewChance:Math.min(interviewChance,95),
salary
};
}

/* COURSES */
const courses={
html:"https://youtu.be/qz0aGYrrlhU",
css:"https://youtu.be/1Rs2ND1ryYc",
javascript:"https://youtu.be/PkZNo7MFNFg",
react:"https://youtu.be/bMknfKXIFA8",
node:"https://youtu.be/TlB_eWDSMt4",
python:"https://youtu.be/_uQrJ0TkZlc"
};

function roadmap(missing){
if(!missing.length) return "<p style='color:green'>Perfect Match 🎉</p>";
let html="";
missing.forEach(skill=>{
let link=courses[skill]||`https://youtube.com/results?search_query=${skill}+course`;
html+=`<div><a target="_blank" href="${link}">📘 Learn ${skill}</a></div>`;
});
return html;
}

/* ANALYZE */
async function analyze(){

const file=document.getElementById("file").files[0];
const out=document.getElementById("result");

out.innerHTML="<div class='loader'>Analyzing...</div>";

try{

const text=await extractText(file);

if(!isResume(text)){
out.innerHTML="<p class='error'>This file doesn't look like a resume.</p>";
return;
}

const snap=await db.collection("jobs").get();
let results=[];

snap.forEach(doc=>{

let job=doc.data();
let skills=(job.skills||[]).map(normalize).filter(Boolean);
if(!skills.length)return;

let matched=skills.filter(s=>text.includes(s));
let missing=skills.filter(s=>!matched.includes(s));

let matchScore=Math.round((matched.length/skills.length)*100);
if(matchScore<40)return;

let ats=calcATS(text,matched,skills.length);
let premium=premiumInsights(text,matched,skills.length);

results.push({title:job.title,matched,missing,matchScore,ats,premium});
});

if(!results.length){
out.innerHTML="<p class='error'>No jobs match above 40%</p>";
return;
}

results.sort((a,b)=>b.matchScore-a.matchScore);
let best=results[0];

let html="";

results.forEach(job=>{

let status=
job.ats>80?"Recruiter-Ready"
:job.ats>65?"Strong"
:job.ats>50?"Needs Improvement"
:"Weak";

html+=`
<div class="job ${job===best?"best":""}">

<h2>${job.title}</h2>

<b>Match Score: ${job.matchScore}%</b>
<div class="bar"><div class="fill" style="width:${job.matchScore}%"></div></div>

<b>ATS Score: ${job.ats}%</b>
<div class="bar"><div class="fill" style="width:${job.ats}%"></div></div>

<b>Status:</b> ${status}

<br><br>

<b>Matched</b><br>
${job.matched.map(s=>`<span class="skill match">${s}</span>`).join("")}

<br><br>

<b>Missing</b><br>
${job.missing.map(s=>`<span class="skill miss">${s}</span>`).join("")}

<h4>Improve Skills</h4>
${roadmap(job.missing)}

<hr>
<b>💎 Premium Insights</b><br>
Strength: ${job.premium.strength}%<br>
Recruiter Read Time: ${job.premium.readTime}s<br>
Interview Chance: ${job.premium.interviewChance}%<br>
Estimated Market Range: ${job.premium.salary}

</div>`;
});

out.innerHTML=html;

}catch{
out.innerHTML="<p class='error'>Upload valid PDF resume</p>";
}
}

/* FEEDBACK */
let rating=0;

function openFeedback(){document.getElementById("feedbackModal").style.display="flex";}
function closeFeedback(){document.getElementById("feedbackModal").style.display="none";}

function rate(n){
rating=n;
document.querySelectorAll(".star").forEach((s,i)=>s.classList.toggle("active",i<n));
}

async function submitFeedback(){

let text=document.getElementById("feedbackText").value.trim();
let msg=document.getElementById("msg");

if(!rating){msg.innerText="Select rating";return;}
if(!text){msg.innerText="Write feedback";return;}

let email=auth.currentUser.email;

await db.collection("feedback").add({
rating,message:text,email,date:new Date().toLocaleString()
});

msg.innerText="Thanks for feedback!";
setTimeout(closeFeedback,1200);
}

</script>
</body>
</html>

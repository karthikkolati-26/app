<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6fb;display:flex}

.sidebar{
width:220px;height:100vh;background:#667eea;color:white;
padding-top:30px;position:fixed
}

.sidebar h2{text-align:center;margin-bottom:30px}

.sidebar button{
display:block;width:80%;margin:12px auto;padding:12px;
border:none;border-radius:8px;background:white;color:#667eea;
font-weight:bold;cursor:pointer
}

.main{margin-left:220px;width:100%;padding:40px}

.card{
background:white;padding:30px;border-radius:18px;width:520px;
margin:auto;box-shadow:0 20px 50px rgba(0,0,0,0.1);text-align:center
}

.primary{
background:#667eea;color:white;border:none;padding:12px;
border-radius:10px;width:100%;margin-top:15px;cursor:pointer
}

.job{
border:1px solid #eee;padding:20px;margin-top:20px;
border-radius:12px;text-align:left
}

.best{
border:2px solid #4CAF50;background:#e8f5e9
}

.skillBox{
margin-top:10px;padding:12px;background:#f9fafc;
border-radius:10px;border:1px solid #eee
}

.learn{
display:inline-block;margin-top:6px;
color:#667eea;font-weight:bold;text-decoration:none
}

.loader{font-size:18px;font-weight:bold;color:#667eea}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Analyzer</h2>
<button onclick="location.href='history.html'">History</button>
<button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">
<div class="card">

<h3>Upload Resume</h3>
<input type="file" id="file"><br>
<button class="primary" onclick="analyze()">Analyze Resume</button>

<div id="result"></div>

</div>
</div>

<!-- LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* ================= FIREBASE ================= */

const firebaseConfig={
apiKey:"AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
authDomain:"job-app-683fa.firebaseapp.com",
projectId:"job-app-683fa",
storageBucket:"job-app-683fa.firebasestorage.app",
messagingSenderId:"951123608239",
appId:"1:951123608239:web:1e75570a094bc98b2b4a5a"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

auth.onAuthStateChanged(user=>{
if(!user) location.href="login.html";
});

function logout(){
auth.signOut().then(()=>location.href="login.html");
}


/* ================= COURSES ================= */

const courses={
html:"https://youtu.be/qz0aGYrrlhU",
css:"https://youtu.be/1Rs2ND1ryYc",
javascript:"https://youtu.be/PkZNo7MFNFg",
react:"https://youtu.be/bMknfKXIFA8",
node:"https://youtu.be/TlB_eWDSMt4",
python:"https://youtu.be/_uQrJ0TkZlc",
sql:"https://youtu.be/HXV3zeQKqGY",
excel:"https://youtu.be/rwbho0CgEAE",
"power bi":"https://youtu.be/TmhQCQr_DCA",
"responsive design":"https://youtu.be/srvUrASNj0s"
};


/* ================= NORMALIZE ================= */

function normalize(s){
return s.toLowerCase().replace(/[^a-z ]/g,"").trim();
}


/* ================= PDF TEXT ================= */

async function extractText(file){

const reader=new FileReader();

return new Promise(resolve=>{
reader.onload=async function(){
const typedarray=new Uint8Array(this.result);
const pdf=await pdfjsLib.getDocument(typedarray).promise;

let text="";
for(let i=1;i<=pdf.numPages;i++){
let page=await pdf.getPage(i);
let content=await page.getTextContent();
text+=content.items.map(item=>item.str).join(" ");
}

resolve(text.toLowerCase());
};
reader.readAsArrayBuffer(file);
});

}


/* ================= ROADMAP ================= */

function generateRoadmap(missing){

if(!missing.length)
return "<p style='color:green'>Perfect match 🎉</p>";

let html="<h4>Learn Missing Skills</h4>";

missing.forEach(skill=>{

let link=courses[normalize(skill)] ||
`https://www.youtube.com/results?search_query=${skill}+course`;

html+=`
<div class="skillBox">
<b>${skill}</b><br>
<a class="learn" target="_blank" href="${link}">
Learn Course
</a>
</div>`;
});

return html;
}



/* ================= ANALYSIS ================= */

async function analyze(){

const file=document.getElementById("file").files[0];
if(!file){alert("Upload resume");return;}

document.getElementById("result").innerHTML=
"<div class='loader'>Analyzing resume...</div>";

const text=await extractText(file);

const snapshot=await db.collection("jobs").get();

let results=[];

snapshot.forEach(doc=>{

let job=doc.data();
let skills=(job.skills||[]).map(s=>normalize(s));

let matched=skills.filter(skill=>text.includes(skill));
let missing=skills.filter(skill=>!matched.includes(skill));

let skillMatch=Math.round((matched.length/skills.length)*100)||0;


/* ===== REAL ATS SCORE ===== */

let ats=0;

/* formatting */
let formatting=20;
if(text.length<400) formatting-=10;
if(text.includes("�")) formatting-=10;
ats+=formatting;

/* sections */
let sections=0;
if(text.includes("experience")) sections+=5;
if(text.includes("education")) sections+=5;
if(text.includes("skills")) sections+=5;
if(text.includes("project")) sections+=5;
ats+=sections;

/* keywords */
ats+=Math.min(matched.length*5,25);

/* skills */
ats+=Math.round((matched.length/skills.length)*15);

/* readability */
let read=10;
if(text.length<800) read-=5;
if(text.split(".").length<5) read-=5;
ats+=read;

/* structure */
let structure=0;
if(text.match(/\d{10}/)) structure+=5;
if(text.includes("@")) structure+=5;
ats+=structure;

ats=Math.max(0,Math.min(ats,100));

/* store */
results.push({
title:job.title,
matched,
missing,
skillMatch,
ats
});

});


if(results.length===0){
document.getElementById("result").innerHTML=
"<h3>No jobs in database</h3>";
return;
}


/* BEST JOB */
results.sort((a,b)=>b.skillMatch-a.skillMatch);
let best=results[0];


/* SAVE HISTORY */
const user=auth.currentUser;

await db.collection("users")
.doc(user.uid)
.collection("history")
.add({
title:best.title,
score:best.skillMatch,
ats:best.ats,
date:new Date().toLocaleString()
});


/* DISPLAY */
let html=`
<div class="job best">
<h2>Best Match → ${best.title}</h2>
<b>Skill Match:</b> ${best.skillMatch}%<br>
<b>ATS Score:</b> ${best.ats}/100
</div>
`;

results.forEach(job=>{
html+=`
<div class="job">

<h3>${job.title}</h3>

<b>Skill Match:</b> ${job.skillMatch}%<br>
<b>ATS Score:</b> ${job.ats}/100<br><br>

<b>Matched:</b> ${job.matched.join(", ")||"None"}<br>
<b style="color:red">Missing:</b> ${job.missing.join(", ")||"None"}

${generateRoadmap(job.missing)}

</div>`;
});

document.getElementById("result").innerHTML=html;

}

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>AI Resume Analyzer</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
text-align:center;
}

h1{
color:white;
margin-bottom:5px;
}

.subtitle{
color:#e0e7ff;
margin-bottom:25px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
width:350px;
margin:auto;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.file{
margin-bottom:20px;
}

.scan{
background:#6366f1;
color:white;
padding:12px;
width:100%;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.scan:hover{
background:#4f46e5;
}

.job{
border:1px solid #eee;
padding:15px;
margin-top:15px;
border-radius:10px;
text-align:left;
}
</style>

</head>

<body>

<div class="container">

<h1>AI Resume Analyzer</h1>
<p class="subtitle">Upload your resume and discover best job matches</p>

<div class="card">

<input type="file" id="resume" class="file">

<button onclick="readResume()" class="scan">
Analyze Resume
</button>

<div id="result"></div>

</div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
  authDomain: "job-app-683fa.firebaseapp.com",
  projectId: "job-app-683fa",
  storageBucket: "job-app-683fa.firebasestorage.app",
  messagingSenderId: "951123608239",
  appId: "1:951123608239:web:1e75570a094bc98b2b4a5a"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();


function readResume(){

let file=document.getElementById("resume").files[0];

if(!file){
alert("Upload resume first");
return;
}

let reader=new FileReader();

reader.onload=function(e){
let text=e.target.result.toLowerCase();
matchJobs(text);
};

reader.readAsText(file);
}


function matchJobs(resumeText){

let jobs=[];

db.collection("jobs").get().then(snapshot=>{

snapshot.forEach(doc=>{

let job=doc.data();

let matched = job.skills.filter(skill =>
resumeText.includes(skill.toLowerCase())
);

let missing = job.skills.filter(skill =>
!resumeText.includes(skill.toLowerCase())
);

let score = Math.round((matched.length/job.skills.length)*100);

if(score>0){
jobs.push({
title:job.title,
score:score,
matched:matched,
missing:missing
});
}

});

jobs.sort((a,b)=>b.score-a.score);

let output="";

jobs.slice(0,3).forEach(job=>{
output+=`
<div class="job">
<h3>${job.title}</h3>

<p>Match Score: <b>${job.score}%</b></p>

<p><b>Matched Skills:</b><br>
${job.matched.join(", ")||"None"}
</p>

<p style="color:red">
<b>Missing Skills:</b><br>
${job.missing.join(", ")||"None"}
</p>

</div>
`;
});

document.getElementById("result").innerHTML =
output || "No matching jobs found";

});
}

</script>

</body>
</html>

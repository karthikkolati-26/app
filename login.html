<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#667eea,#764ba2);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* CARD */
.card{
background:white;
padding:35px;
border-radius:18px;
width:380px;
box-shadow:0 20px 60px rgba(0,0,0,0.2);
text-align:center;
}

/* INPUT */
input{
width:100%;
padding:12px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

.loginBtn{
background:#667eea;
color:white;
}

.signupBtn{
background:#eee;
}

button:hover{
opacity:.9;
}

#msg{
margin-top:15px;
font-weight:bold;
}

/* MOBILE */
@media(max-width:500px){
.card{
width:90%;
padding:25px;
}
}

</style>
</head>

<body>

<div class="card">

<h2>AI Resume Analyzer</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="loginBtn" onclick="login()">Login</button>
<button class="signupBtn" onclick="signup()">Create Account</button>

<p id="msg"></p>

</div>


<!-- FIREBASE LIBRARIES -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script>

// ================= FIREBASE CONFIG =================

const firebaseConfig = {
  apiKey: "AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
  authDomain: "job-app-683fa.firebaseapp.com",
  projectId: "job-app-683fa",
  storageBucket: "job-app-683fa.firebasestorage.app",
  messagingSenderId: "951123608239",
  appId: "1:951123608239:web:1e75570a094bc98b2b4a5a"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();


// ================= LOGIN FUNCTION =================

function login(){

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();
let msg=document.getElementById("msg");

msg.style.color="#667eea";
msg.innerText="Checking credentials...";

auth.signInWithEmailAndPassword(email,password)

.then(()=>{
location.href="dashboard.html";
})

.catch(e=>{

msg.style.color="red";

switch(e.code){

case "auth/invalid-credential":
msg.innerText="Incorrect email or password";
break;

case "auth/user-not-found":
msg.innerText="No account found with this email";
break;

case "auth/wrong-password":
msg.innerText="Wrong password";
break;

case "auth/network-request-failed":
msg.innerText="Network error. Check internet";
break;

case "auth/too-many-requests":
msg.innerText="Too many attempts. Try later";
break;

default:
msg.innerText="Login failed. Try again";
}

});

}


// ================= SIGNUP FUNCTION =================

function signup(){

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();
let msg=document.getElementById("msg");

msg.style.color="#667eea";
msg.innerText="Creating account...";

auth.createUserWithEmailAndPassword(email,password)

.then(()=>{
msg.style.color="green";
msg.innerText="Account created successfully. Now login.";
})

.catch(e=>{

msg.style.color="red";

switch(e.code){

case "auth/email-already-in-use":
msg.innerText="Email already registered";
break;

case "auth/invalid-email":
msg.innerText="Invalid email format";
break;

case "auth/weak-password":
msg.innerText="Password must be at least 6 characters";
break;

default:
msg.innerText="Signup failed. Try again";
}

});

}

</script>

</body>
</html>

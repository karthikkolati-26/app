<!DOCTYPE html>
<html>
<head>
<title>ResumeAI Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.container{
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.tag{
font-size:14px;
color:#c7d2fe;
margin-bottom:30px;
}

.card{
background:white;
color:black;
padding:35px;
width:320px;
border-radius:18px;
box-shadow:0 25px 60px rgba(0,0,0,0.3);
}

input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#4f46e5;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#4338ca;
}

.secondary{
background:#e0e7ff;
color:#1e3a8a;
}

.secondary:hover{
background:#c7d2fe;
}

#msg{
margin-top:15px;
font-size:14px;
color:#dc2626;
}

.footer{
margin-top:25px;
font-size:12px;
color:#c7d2fe;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ResumeAI</div>
<div class="tag">Smart Resume Intelligence Platform</div>

<div class="card">

<h2>Welcome Back</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()" class="secondary">Create Account</button>

<div id="msg"></div>

</div>

<div class="footer">
AI-Powered Resume Analyzer
</div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBvJGcM5bKgsdaiTSP4yytC-6Kldc-J35I",
  authDomain: "job-app-683fa.firebaseapp.com",
  projectId: "job-app-683fa",
  storageBucket: "job-app-683fa.firebasestorage.app",
  messagingSenderId: "951123608239",
  appId: "1:951123608239:web:1e75570a094bc98b2b4a5a"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();


function login(){
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();
let msg=document.getElementById("msg");

msg.style.color="red";
msg.innerText="";

auth.signInWithEmailAndPassword(email,password)
.then(()=>{
location.href="dashboard.html";
})
.catch(e=>{

if(e.code==="auth/invalid-credential")
msg.innerText="Incorrect email or password";

else if(e.code==="auth/user-not-found")
msg.innerText="Account not found";

else if(e.code==="auth/wrong-password")
msg.innerText="Wrong password";

else if(e.code==="auth/invalid-email")
msg.innerText="Invalid email format";

else if(e.code==="auth/too-many-requests")
msg.innerText="Too many attempts. Try again later";

else if(e.code==="auth/network-request-failed")
msg.innerText="No internet connection";

else
msg.innerText="Login failed. Try again.";

});
}



function signup(){
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();
let msg=document.getElementById("msg");

msg.innerText="";
msg.style.color="red";

auth.createUserWithEmailAndPassword(email,password)
.then(()=>{
msg.style.color="green";
msg.innerText="Account created successfully! Please login.";
})
.catch(e=>{

if(e.code==="auth/email-already-in-use")
msg.innerText="Email already registered";

else if(e.code==="auth/weak-password")
msg.innerText="Password must be at least 6 characters";

else if(e.code==="auth/invalid-email")
msg.innerText="Invalid email format";

else if(e.code==="auth/network-request-failed")
msg.innerText="Check internet connection";

else
msg.innerText="Signup failed. Try again.";

});
}
</script>


<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
